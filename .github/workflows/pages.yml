name: Deploy to GitHub Pages

# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# The site is served from https://<user>.github.io/<repo>/, so the build uses the repository name as
# its base path. To publish under a custom domain (served from "/"), set the repository variable
# VITE_BASE to "/" (Settings -> Secrets and variables -> Actions -> Variables). See docs/deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
