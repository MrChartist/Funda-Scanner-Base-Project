name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:strict
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build for a sub-path (GitHub Pages project site)
        run: |
          VITE_BASE=/Funda-Scanner-Base-Project/ npm run build
          grep -q 'src="/Funda-Scanner-Base-Project/assets/' dist/index.html
          test -f dist/404.html
          grep -q '"start_url": "./"' dist/manifest.json
