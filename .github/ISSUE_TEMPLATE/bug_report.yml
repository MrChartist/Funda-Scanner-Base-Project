name: Bug report
description: Something is broken or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /screener\n2. ..."
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Browser + version, OS, Node version"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / console errors
